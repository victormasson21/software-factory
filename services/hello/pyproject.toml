[project]
name = "hello"
version = "0.1.0"
description = "Hello-world service, the factory's test subject"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
