name: hello

on:
  pull_request:
    paths:
      - services/hello/**
      - deploy/**
      - .github/workflows/hello.yml
      - .github/workflows/service-ci.yml
      - .github/workflows/service-deploy.yml
  push:
    branches: [main]
    paths:
      - services/hello/**
      - deploy/**
      - .github/workflows/hello.yml
      - .github/workflows/service-ci.yml
      - .github/workflows/service-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: hello
    permissions:
      contents: read
      packages: write

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEV_HOST != ''
    uses: ./.github/workflows/service-deploy.yml
    with:
      service: hello
      environment: dev
      image: ${{ needs.ci.outputs.image }}
      version: ${{ github.sha }}
    secrets:
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
