name: hello

on:
  pull_request:
    paths:
      - services/hello/**
      - deploy/**
      - .github/workflows/hello.yml
      - .github/workflows/service-ci.yml
      - .github/workflows/service-deploy.yml
  push:
    branches: [main]
    paths:
      - services/hello/**
      - deploy/**
      - .github/workflows/hello.yml
      - .github/workflows/service-ci.yml
      - .github/workflows/service-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: hello
    permissions:
      contents: read
      packages: write
